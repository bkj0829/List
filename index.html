<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7일간의 휴가 🏖️ 공동구매 참여</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --ocean:   #0077B6;
  --sky:     #00B4D8;
  --foam:    #90E0EF;
  --sand:    #FFF3E0;
  --sand2:   #FFE0B2;
  --coral:   #FF6B6B;
  --sun:     #FFD166;
  --white:   #FFFFFF;
  --dark:    #023E5C;
  --text:    #1A3A4A;
  --muted:   #7AA8BC;
  --radius:  18px;
  --shadow:  0 8px 32px rgba(0,119,182,0.13);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(160deg, #CAF0F8 0%, #ADE8F4 30%, #90E0EF 60%, #48CAE4 100%);
  min-height: 100vh;
  padding: 0 0 60px;
  overflow-x: hidden;
}

.hero {
  position: relative;
  background: linear-gradient(135deg, #023E5C 0%, #0077B6 50%, #00B4D8 100%);
  padding: 48px 20px 80px;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 30%, rgba(255,209,102,0.18) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 80%, rgba(0,180,216,0.25) 0%, transparent 50%);
}
.hero-emoji {
  font-size: 52px;
  display: block;
  margin-bottom: 10px;
  animation: float 3s ease-in-out infinite;
  position: relative;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.hero h1 {
  font-family: 'Nunito', 'Noto Sans KR', sans-serif;
  font-size: clamp(22px, 5vw, 34px);
  font-weight: 900;
  color: #fff;
  line-height: 1.25;
  position: relative;
  letter-spacing: -0.5px;
}
.hero h1 span { color: var(--sun); display: inline-block; }
.hero-sub {
  margin-top: 10px;
  font-size: 14px;
  color: rgba(255,255,255,0.78);
  position: relative;
  line-height: 1.7;
}
.wave {
  position: absolute;
  bottom: -2px; left: 0; width: 100%;
  height: 48px;
}

.container {
  max-width: 700px;
  margin: -20px auto 0;
  padding: 0 20px;
  position: relative;
  z-index: 2;
}
.card {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 32px 28px 36px;
  box-shadow: var(--shadow), 0 2px 0 rgba(0,180,216,0.15);
  border: 1.5px solid rgba(255,255,255,0.8);
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.section-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.section-title .icon { font-size: 20px; }

.item-scroll {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding-bottom: 4px;
}
.item-card {
  border-radius: 16px;
  border: 2.5px solid transparent;
  background: linear-gradient(145deg, #F0FAFF, #E0F5FF);
  padding: 16px 10px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(.4,0,.2,1);
  position: relative;
  user-select: none;
}
.item-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,119,182,0.18);
}
.item-card.selected {
  border-color: var(--ocean);
  background: linear-gradient(145deg, #E0F4FF, #C8EDFF);
  box-shadow: 0 6px 20px rgba(0,119,182,0.22);
  transform: translateY(-4px);
}
.item-card .check {
  position: absolute;
  top: 8px; right: 8px;
  width: 20px; height: 20px;
  background: var(--ocean);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #fff;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.2s;
}
.item-card.selected .check { opacity: 1; transform: scale(1); }
.item-emoji { font-size: 32px; display: block; margin-bottom: 8px; }
.item-name  { font-size: 12px; font-weight: 700; color: var(--dark); line-height: 1.35; }
.item-num   { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }

.multi-tip { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: right; }

.divider { border: none; border-top: 1.5px dashed #C9E8F4; margin: 26px 0; }

.field-group { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 13px; font-weight: 700; color: var(--dark);
  display: flex; align-items: center; gap: 6px;
}
.field label .licon { font-size: 16px; }
.field input {
  width: 100%; padding: 13px 16px;
  border: 2px solid #D6EEF8; border-radius: 12px;
  font-size: 15px; font-family: 'Noto Sans KR', sans-serif;
  color: var(--text); background: #F7FBFF; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.field input::placeholder { color: #B0CCDA; }
.field input:focus {
  border-color: var(--sky); background: #fff;
  box-shadow: 0 0 0 4px rgba(0,180,216,0.12);
}
.field input.error { border-color: var(--coral); background: #FFF5F5; }

.insta-prefix { position: relative; }
.insta-prefix input { padding-left: 42px; }
.insta-prefix::before {
  content: '@'; position: absolute; left: 15px; top: 50%;
  transform: translateY(-50%); font-size: 15px; font-weight: 700;
  color: var(--muted); pointer-events: none;
}

.submit-btn {
  width: 100%; margin-top: 28px; padding: 17px; border: none;
  border-radius: 16px; background: linear-gradient(135deg, #0077B6, #00B4D8);
  color: #fff; font-size: 16px; font-weight: 800;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
  letter-spacing: 0.3px; transition: all 0.22s;
  box-shadow: 0 6px 20px rgba(0,119,182,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,119,182,0.45);
